# This is a basic workflow to help you get started with Actions

name: SM8150 Xiaomi Pad5

# Controls when the workflow will run
on:
#  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
    paths:
      - 'Platforms/SurfaceDuo1Pkg/Device/xiaomi-nabu/**'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Indicate that we are running in CI
env:
  WM_CI_BUILD: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-22.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: Build SB/NOSB uefi for xiaomi pad 5.
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git submodule update --init MU_BASECORE
          sed -i 's/Zeex/wyrover/g' MU_BASECORE/.gitmodules
          git submodule update --init --recursive
          bash scripts/container_setup.sh && ./build_uefi.py -d xiaomi-nabu

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uefi-images-nabu
          path: |
            Build/*/*.img
            Build/*/*/*/*.fd
          compression-level: 9
