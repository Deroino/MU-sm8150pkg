name: SM8150 Xiaomi Pad5 (DEBUG)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Platforms/SurfaceDuo1Pkg/Device/xiaomi-nabu/**'
  workflow_dispatch:

env:
  WM_CI_BUILD: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build DEBUG uefi for xiaomi pad 5.
        run: bash scripts/ci_setup.sh && ./build_uefi.py -d xiaomi-nabu -t DEBUG
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uefi-images-nabu-debug
          path: Build/*/ci_artifacts
          compression-level: 9